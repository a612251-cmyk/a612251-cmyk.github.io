<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⟢ 劇情模擬器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#090910;color:#ddddf0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#2a2a55;border-radius:4px}
#header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#11111d;border-bottom:1px solid #232338;flex-shrink:0;overflow-x:auto}
.logo{font-size:15px;font-weight:700;color:#c4b5fd;white-space:nowrap;flex-shrink:0}
#model-select{background:#1a1a2e;color:#c4b5fd;border:1px solid #30305a;border-radius:7px;padding:4px 6px;font-size:11px;cursor:pointer;outline:none;flex-shrink:0}
.hbtns{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.hbtn{background:#1a1a2e;border:1px solid #282840;color:#9999bb;border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.hbtn:hover{background:#232340}
.hbtn.active{background:#252545;color:#c4b5fd;border-color:#4040aa}
.hbtn.danger{color:#f87171}
.view{display:none;flex:1;overflow:hidden;flex-direction:column}
.view.active{display:flex}
#settings-view{overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.s-title{color:#c4b5fd;font-size:15px;margin-bottom:12px}
.label{display:block;font-size:12px;color:#7777aa;margin-bottom:5px;margin-top:12px}
.inp{width:100%;background:#15152a;border:1px solid #282845;color:#ddddf0;border-radius:8px;padding:8px 12px;font-size:16px;outline:none;font-family:inherit}
.inp:focus{border-color:#5555cc}
.ta{resize:vertical;min-height:80px;font-size:13px}
.inp-num{width:60px;display:inline-block;font-size:14px}
input[type=range]{width:100%;cursor:pointer;accent-color:#7c3aed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.reminder-row{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.primary-btn{background:#5b21b6;border:none;color:white;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;font-weight:600;margin-top:16px;width:100%}
.primary-btn:disabled{opacity:.4;cursor:default}
#compress-header{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid #232338;flex-shrink:0;flex-wrap:wrap}
.c-title{color:#c4b5fd;font-weight:600;font-size:13px}
.c-count{color:#666;font-size:12px}
#compress-list{flex:1;overflow-y:auto;padding:6px 12px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}
.c-item{display:flex;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;background:#13131f;border:1px solid #222235;align-items:flex-start}
.c-item.sel{background:#1e0e3a;border-color:#5b21b6}
.cbox{width:18px;height:18px;border-radius:4px;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:2px}
.cbox.on{background:#6d28d9;border-color:#a78bfa;color:white}
.c-info{flex:1;overflow:hidden}
.c-role{font-size:11px;font-weight:600;display:block;margin-bottom:2px}
.c-role.user{color:#7c3aed}
.c-role.dm{color:#059669}
.c-preview{font-size:12px;color:#666;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#compress-footer{padding:8px 12px;border-top:1px solid #232338;flex-shrink:0}
#chat-area{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.empty{text-align:center;margin:auto;color:#444;padding:20px}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-title{font-size:14px;color:#c4b5fd;margin-bottom:6px}
.empty-sub{font-size:13px}
.bwrap{display:flex;flex-direction:column;gap:3px}
.bwrap.user{align-items:flex-end}
.bwrap.dm{align-items:flex-start}
.role-lbl{font-size:13px;color:#555;padding:0 4px}
.role-lbl.user{color:#7c3aed}
.role-lbl.dm{color:#059669}
.bubble{padding:10px 12px;border-radius:12px;font-size:15px;line-height:1.65;word-break:break-word;max-width:92%;overflow-x:hidden}
.bubble.user{background:#180f38;border:1px solid #2e1a6e;border-radius:12px 12px 4px 12px}
.bubble.dm{background:#111120;border:1px solid #1e1e38;border-radius:12px 12px 12px 4px}
.bubble.summary{background:#0c1825;border-color:#1a4070}
.dots{display:flex;gap:4px;align-items:center;height:20px}
.dot{width:6px;height:6px;border-radius:50%;background:#a78bfa;animation:blink 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.err-box{background:#1a0808;border:1px solid #7f1d1d;border-radius:8px;padding:10px 14px;color:#fca5a5;font-size:13px}
#input-area{display:flex;gap:6px;padding:8px 10px;background:#0c0c18;border-top:1px solid #1a1a30;flex-shrink:0;align-items:flex-end;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#input-box{flex:1;background:#13132a;border:1px solid #25254a;border-radius:12px;overflow:hidden;min-width:0}
#msg-input{width:100%;background:transparent;border:none;outline:none;color:#ddddf0;padding:10px 12px;resize:none;font-family:inherit;font-size:16px;line-height:1.5;display:block}
#msg-input::placeholder{color:#404060;font-size:14px}
#input-toolbar{display:flex;align-items:center;gap:6px;padding:3px 8px 7px;border-top:1px solid #1a1a30;overflow:hidden}
.tool-btn{background:#1e1e3a;border:1px solid #28285a;color:#a78bfa;border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0}
#turn-info{font-size:11px;color:#404060;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#send-btn{width:42px;height:42px;border-radius:12px;background:#5b21b6;border:none;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#send-btn:disabled{opacity:.35;cursor:default}
.bubble table{width:100%;border-collapse:collapse;margin:6px 0;font-size:13px;display:block;overflow-x:auto}
.bubble th{background:#1c1c38;color:#a78bfa;padding:6px 10px;text-align:left;border:1px solid #28285a;font-weight:600;white-space:nowrap}
.bubble td{padding:5px 10px;border:1px solid #1e1e38;color:#cccce0;font-size:13px}
.bubble tr:nth-child(even) td{background:#10101e}
.bubble hr{border:none;border-top:1px solid #282845;margin:8px 0}
.bubble h1{color:#c4b5fd;font-size:15px;margin:10px 0 4px}
.bubble h2{color:#a78bfa;font-size:15px;margin:8px 0 3px}
.bubble h3{color:#8b5cf6;font-size:14px;margin:6px 0 3px}
.bubble p{margin:3px 0}
.bubble strong{color:#e0d8ff}
.bubble em{color:#d4c0ff;font-style:italic}
.bubble code{background:#1c1c38;padding:1px 5px;border-radius:3px;font-size:11px;color:#a78bfa;font-family:monospace}
.bubble blockquote{background:#181830;border-left:3px solid #5b21b6;padding:7px 10px;margin:5px 0;border-radius:0 5px 5px 0;color:#aaa;font-size:14px}
.bubble .insert-block{background:#141428;border:1px dashed #2a2a55;padding:7px 10px;margin:6px 0;border-radius:6px;color:#888;font-size:14px}
.bubble .sp{height:5px}
.bubble .li{padding:2px 0 2px 4px;color:#ccc;font-size:14px}
.bubble pre{background:#1a1a30;border:1px solid #2a2a45;border-radius:8px;padding:10px;overflow-x:auto;margin:6px 0}
.bubble pre code{background:transparent;padding:0;color:#ccc}
.bubble .html-frame-wrap{width:100%;margin:8px 0;overflow:hidden}
.bubble .html-frame{width:100%;border:none;border-radius:10px;display:block;min-height:200px;background:#fff;transition:height .2s}
.bubble .phone-header{font-size:12px;color:#888;text-align:center;margin:8px 0 3px}
.bubble .phone-line{display:flex;align-items:center;gap:6px;padding:3px 2px;flex-wrap:wrap}
.bubble .pi{color:#c4b5fd;font-size:13px;flex-shrink:0;letter-spacing:2px}
.bubble .pk{border:1px solid #9999cc;border-radius:5px;padding:3px 10px;font-size:14px;color:#e0e0f0;background:#1a1a30}
.bubble .pt{color:#969696;font-style:italic;font-size:12px}
.bubble .phone-note{font-size:12px;color:#666;padding:2px 0 2px 20px;font-style:italic}
.bubble .phone-sep{border:none;border-top:1px dashed #333;margin:5px 0}
@media(max-width:480px){
  .row2{grid-template-columns:1fr}
  .bubble{font-size:15px;max-width:95%;line-height:1.7}
  .bubble table{font-size:12px}
  #model-select{max-width:75px}
  .logo{font-size:13px}
  #chat-area{padding:10px 8px}
}
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <span class="logo">⟢ 劇情模擬器</span>
  <select id="model-select">
    <option value="deepseek-chat">Chat（推薦）</option>
    <option value="deepseek-v4-flash">V4 Flash</option>
    <option value="deepseek-v4-pro">V4 Pro</option>
    <option value="deepseek-reasoner">Reasoner</option>
  </select>
  <div class="hbtns">
    <button class="hbtn active" onclick="showTab('chat')">💬 對話</button>
    <button class="hbtn" onclick="showTab('settings')">⚙ 設定</button>
    <button class="hbtn" onclick="showTab('compress')">✂ 壓縮</button>
    <button class="hbtn" onclick="exportChat()">💾 匯出</button>
    <button class="hbtn danger" onclick="clearChat()">🗑 清除</button>
  </div>
</div>

<!-- Settings View -->
<div id="settings-view" class="view">
  <h2 class="s-title">設定</h2>
  <label class="label">DeepSeek API Key</label>
  <input class="inp" id="api-key" type="password" placeholder="sk-...">
  <label class="label">System Prompt</label>
  <textarea class="inp ta" id="system-prompt" rows="10" placeholder="在此貼入 System Prompt…"></textarea>
  <label class="label">格式提醒內容（可自訂）</label>
  <textarea class="inp ta" id="reminder-text" rows="6"></textarea>
  <div class="row2">
    <div>
      <label class="label">Temperature: <span id="temp-val">0.75</span></label>
      <input type="range" id="temp" min="0" max="1.5" step="0.05" value="0.75" oninput="document.getElementById('temp-val').textContent=this.value">
    </div>
    <div>
      <label class="label">Max Tokens: <span id="tokens-val">4000</span></label>
      <input type="range" id="max-tokens" min="500" max="8000" step="100" value="4000" oninput="document.getElementById('tokens-val').textContent=this.value">
    </div>
  </div>
  <div class="reminder-row">
    <input type="checkbox" id="auto-reminder" checked>
    <label class="label" style="margin:0" for="auto-reminder">自動格式提醒（每</label>
    <input class="inp inp-num" type="number" id="reminder-every" value="10" min="1" max="50">
    <label class="label" style="margin:0">輪）</label>
  </div>
  <button class="primary-btn" onclick="showTab('chat')">← 返回對話</button>
</div>

<!-- Compress View -->
<div id="compress-view" class="view">
  <div id="compress-header">
    <span class="c-title">選擇要壓縮的訊息</span>
    <span class="c-count" id="sel-count">已選 0 條</span>
    <div style="flex:1"></div>
    <button class="hbtn" onclick="selectHalf()">選前一半</button>
    <button class="hbtn" onclick="clearSel()">清除選擇</button>
    <button class="primary-btn" id="compress-btn" onclick="compressSelected()" disabled style="margin:0">壓縮選中的 0 條</button>
  </div>
  <div id="compress-list"></div>
  <div id="compress-footer">
    <button class="hbtn" onclick="showTab('chat')">← 返回對話</button>
  </div>
</div>

<!-- Chat View -->
<div id="chat-view" class="view active">
  <div id="chat-area">
    <div class="empty">
      <div class="empty-icon">⟢</div>
      <div class="empty-title">劇情模擬器</div>
      <div class="empty-sub">在設定裡貼入 API Key 和 System Prompt，然後開始</div>
    </div>
  </div>
  <div id="input-area">
    <div id="input-box">
      <textarea id="msg-input" rows="3" placeholder="輸入訊息… (Enter 送出，Shift+Enter 換行)"></textarea>
      <div id="input-toolbar">
        <button class="tool-btn" onclick="injectReminder()">📋 格式提醒</button>
        <span id="turn-info">第 0 輪</span>
      </div>
    </div>
    <button id="send-btn" onclick="sendMessage()" disabled>↑</button>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let messages = [];
let turnCount = 0;
let loading = false;
let selectedSet = new Set();

const DEFAULT_REMINDER = `【格式提醒｜即刻生效】
每輪必須完整輸出三個區塊，缺一不可：
① 📊 屬性面板（表格，具體數字，每格有狀態說明）
② 劇情正文（400字以上，第二人稱「你」，對話不超過一半）
③ ABCDE 五個選項（表格）
禁止輸出英文思考過程或內部草稿。`;

document.getElementById('reminder-text').value = DEFAULT_REMINDER;

// ─── Tab switching ────────────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.hbtn').forEach(b => b.classList.remove('active'));
  document.getElementById(name + '-view').classList.add('active');
  document.querySelectorAll('.hbtn').forEach(b => {
    if (b.textContent.includes(name === 'chat' ? '對話' : name === 'settings' ? '設定' : '壓縮')) b.classList.add('active');
  });
  if (name === 'compress') renderCompressList();
}

// ─── HTML Frame Store ─────────────────────────────────────────────────────────
let _frameSeq = 0;

function resizeFrame(f) {
  try {
    var h = f.contentDocument.documentElement.scrollHeight;
    if (h > 0) f.style.height = (h + 8) + 'px';
  } catch(e) { f.style.height = '500px'; }
}

// ─── Markdown Parser ──────────────────────────────────────────────────────────
function esc(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function inlineFormat(t) {
  return esc(t)
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
}

function parseTable(lines) {
  const rows = lines
    .filter(l => !/^\|[\s\-\|:]+\|$/.test(l.trim()))
    .map(l => l.split('|').filter((_,i,a) => i>0 && i<a.length-1).map(c => c.trim()));
  if (!rows.length) return '';
  const [hdr, ...body] = rows;
  return `<table>
    <thead><tr>${hdr.map(c=>`<th>${inlineFormat(c)}</th>`).join('')}</tr></thead>
    <tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inlineFormat(c)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}

function parseMarkdown(text) {
  if (!text) return '';
  const lines = text.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];

    // 📲 Phone message block opener
    if (line.trim().startsWith('📲') || line.trim().startsWith('📱MSG')) {
      const headerMatch = line.match(/你收到了(.+?)的訊息/) || line.match(/📲\s*你收到了(.+?)的訊息/);
      const senderName = headerMatch ? headerMatch[1] : line.replace(/^📲\s*/,'').replace(/📱MSG/,'').trim();
      const phoneLines = [];
      i++;
      while (i < lines.length && lines[i].trim() !== '' && !lines[i].trim().startsWith('📱END')) {
        if (lines[i].includes('𖦹') || lines[i].trim().startsWith('𖦹')) {
          phoneLines.push(lines[i]);
        }
        i++;
      }
      if (lines[i] && lines[i].trim() === '📱END') i++;
      // Build phone card
      const msgHtml = phoneLines.map(pl => {
        const cleaned = pl.replace(/𖦹[‎.]*𖦹[‎]*/g,'').trim();
        // Extract Korean and Chinese: "Korean（Chinese）" or "Korean (Chinese)"
        const transMatch = cleaned.match(/^(.+?)[\s]*[（(]([^）)]+)[）)](.*)$/);
        let korText, chnText, extra = '';
        if (transMatch) {
          korText = transMatch[1].trim();
          chnText = transMatch[2].trim();
          extra = transMatch[3].trim();
        } else {
          korText = cleaned;
          chnText = '';
        }
        // Handle dot-separated sentences (split on . and render each on new line)
        const korParts = korText.split(/(?<=\w)\.(?=\s|\w)/).map(p => p.trim()).filter(Boolean);
        const lineHtml = korParts.map((kp, idx) => {
          const isLast = idx === korParts.length - 1;
          return `<div class="phone-line">
            <span class="phone-icon">𖦹‎.𖦹‎</span>
            <span class="phone-kor">${esc(kp)}</span>
            ${isLast && chnText ? `<span class="phone-chn">（${esc(chnText)}）</span>` : ''}
          </div>`;
        }).join('');
        return lineHtml;
      }).join('');
      out.push(`<div class="phone-wrap">
        <div class="phone-header">你收到了${esc(senderName)}的訊息</div>
        ${msgHtml}
      </div>`);
      continue;
    }

    // 𖦹.𖦹 standalone line (phone message without block opener)
    if (line.includes('𖦹') && (line.trim().startsWith('𖦹') || line.includes('𖦹.𖦹'))) {
      const cleaned = line.replace(/𖦹[‎.]*𖦹[‎]*/g,'').trim();
      const transMatch = cleaned.match(/^(.+?)[\s]*[（(]([^）)]+)[）)](.*)$/);
      let korText = transMatch ? transMatch[1].trim() : cleaned;
      let chnText = transMatch ? transMatch[2].trim() : '';
      const korParts = korText.split(/(?<=\w)\.(?=\s)/).map(p=>p.trim()).filter(Boolean);
      const lineHtml = korParts.map((kp,idx) => {
        const isLast = idx === korParts.length-1;
        return `<div class="phone-line"><span class="phone-icon">𖦹‎.𖦹‎</span><span class="phone-kor">${esc(kp)}</span>${isLast&&chnText?`<span class="phone-chn">（${esc(chnText)}）</span>`:''}</div>`;
      }).join('');
      out.push(lineHtml);
      i++; continue;
    }

    // Table
    if (line.trim().startsWith('|') && i+1<lines.length && /^\|[\s\-\|:]+\|/.test(lines[i+1])) {
      const tl = [];
      while (i<lines.length && lines[i].trim().startsWith('|')) { tl.push(lines[i]); i++; }
      out.push(parseTable(tl)); continue;
    }
    // Code block (```lang ... ```)
    if (line.startsWith('```')) {
      const lang = line.slice(3).trim().toLowerCase();
      const blockLines = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) {
        blockLines.push(lines[i]);
        i++;
      }
      i++; // skip closing ```
      const content = blockLines.join('\n');
      if (lang === 'html') {
        try {
          const blob = new Blob([content], {type: 'text/html;charset=utf-8'});
          const burl = URL.createObjectURL(blob);
          out.push(`<div class="html-frame-wrap"><iframe class="html-frame" src="${burl}" onload="setTimeout(()=>resizeFrame(this),200)"></iframe></div>`);
        } catch(e) {
          out.push(`<pre><code>${esc(content)}</code></pre>`);
        }
      } else {
        out.push(`<pre><code>${esc(content)}</code></pre>`);
      }
      continue;
    }
    // Phone message header: 你收到了ㅇㅇ的訊息
    if (/你收到了.+的訊息/.test(line) || /你收到了.+的消息/.test(line)) {
      out.push(`<div class="phone-header">${esc(line)}</div>`);
      i++; continue;
    }
    // Phone separator (--- after header)
    if (line.trim() === '---' && i > 0 && /你收到了/.test(lines[i-1]||'')) {
      out.push('<hr class="phone-sep">');
      i++; continue;
    }
    // Phone message line: 𖦹.𖦹 韓文 （中文）
    if (/^𖦹/.test(line)) {
      const m = line.match(/^𖦹[.。]𖦹\s+([\s\S]+?)\s+（(.+?)）\s*$/);
      if (m) {
        out.push(`<div class="phone-line"><span class="pi">𖦹.𖦹</span><span class="pk">${esc(m[1])}</span><span class="pt">（${esc(m[2])}）</span></div>`);
      } else {
        out.push(`<div class="phone-line"><span class="pi">𖦹.𖦹</span><span class="pk">${processInline(line.replace(/^𖦹[.。]𖦹\s*/,''))}</span></div>`);
      }
      i++; continue;
    }
    // Korean dialogue line without 𖦹 prefix: 한국어 （中文翻譯）
    // Detects lines with Hangul characters followed by （Chinese）
    if (/[\uAC00-\uD7AF]/.test(line) && /（.+）/.test(line)) {
      const m = line.match(/^(.*?)（(.+?)）\s*$/);
      if (m) {
        out.push(`<div class="phone-line"><span class="pk">${esc(m[1].trim())}</span><span class="pt">（${esc(m[2])}）</span></div>`);
      } else {
        out.push(`<p>${processInline(line)}</p>`);
      }
      i++; continue;
    }
    // Note after phone line: 注：...
    if (/^注[：:]/.test(line)) {
      out.push(`<div class="phone-note">${esc(line)}</div>`);
      i++; continue;
    }
    // HR
    if (/^[━─\-=_]{3,}$/.test(line.trim())) { out.push('<hr>'); i++; continue; }
    // Headers
    let m;
    if ((m=line.match(/^###\s+(.+)/))) { out.push(`<h3>${inlineFormat(m[1])}</h3>`); i++; continue; }
    if ((m=line.match(/^##\s+(.+)/)))  { out.push(`<h2>${inlineFormat(m[1])}</h2>`); i++; continue; }
    if ((m=line.match(/^#\s+(.+)/)))   { out.push(`<h1>${inlineFormat(m[1])}</h1>`); i++; continue; }
    // Blockquote
    if (line.startsWith('>')) { out.push(`<blockquote>${inlineFormat(line.slice(1).trim())}</blockquote>`); i++; continue; }
    // 插播
    if (line.startsWith('【插播')) { out.push(`<div class="insert-block">${inlineFormat(line)}</div>`); i++; continue; }
    // List
    if (/^[\-\*✦•]\s+/.test(line)) { out.push(`<div class="li">${inlineFormat(line.replace(/^[\-\*✦•]\s+/,''))}</div>`); i++; continue; }
    // Empty
    if (!line.trim()) { out.push('<div class="sp"></div>'); i++; continue; }
    // Para
    out.push(`<p>${inlineFormat(line)}</p>`);
    i++;
  }
  return out.join('');
}

// ─── Chat ─────────────────────────────────────────────────────────────────────
function updateSendBtn() {
  const apiKey = document.getElementById('api-key').value.trim();
  const input = document.getElementById('msg-input').value.trim();
  document.getElementById('send-btn').disabled = loading || !apiKey || !input;
}

document.getElementById('msg-input').addEventListener('input', updateSendBtn);
document.getElementById('api-key').addEventListener('input', updateSendBtn);

document.getElementById('msg-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function injectReminder() {
  const ta = document.getElementById('msg-input');
  const r = document.getElementById('reminder-text').value;
  ta.value = ta.value ? ta.value + '\n\n' + r : r;
  ta.focus();
  updateSendBtn();
}

function updateTurnInfo() {
  const auto = document.getElementById('auto-reminder').checked;
  const every = parseInt(document.getElementById('reminder-every').value) || 10;
  const next = Math.ceil((turnCount + 1) / every) * every;
  document.getElementById('turn-info').textContent =
    `第 ${turnCount} 輪${auto ? ` · 下次提醒：第 ${next} 輪` : ''}`;
}

function appendMessage(msg) {
  const area = document.getElementById('chat-area');
  const empty = area.querySelector('.empty');
  if (empty) empty.remove();

  const wrap = document.createElement('div');
  wrap.className = `bwrap ${msg.role}`;
  wrap.dataset.idx = messages.length - 1;

  const lbl = document.createElement('span');
  lbl.className = `role-lbl ${msg.role}`;
  lbl.textContent = msg.role === 'user' ? '玩家' : 'DM';
  if (msg.isSummary) lbl.textContent += ' 📁';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${msg.role}${msg.isSummary ? ' summary' : ''}`;
  bubble.innerHTML = parseMarkdown(msg.display || msg.content);

  wrap.appendChild(lbl);
  wrap.appendChild(bubble);
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
  return bubble;
}

function showLoading() {
  const area = document.getElementById('chat-area');
  const wrap = document.createElement('div');
  wrap.className = 'bwrap dm';
  wrap.id = 'loading-bubble';
  const lbl = document.createElement('span');
  lbl.className = 'role-lbl dm';
  lbl.textContent = 'DM';
  const bubble = document.createElement('div');
  bubble.className = 'bubble dm';
  bubble.innerHTML = '<div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  wrap.appendChild(lbl);
  wrap.appendChild(bubble);
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
}

function hideLoading() {
  const el = document.getElementById('loading-bubble');
  if (el) el.remove();
}

async function sendMessage() {
  const apiKey = document.getElementById('api-key').value.trim();
  const inputEl = document.getElementById('msg-input');
  const raw = inputEl.value.trim();
  if (!raw || loading || !apiKey) return;

  let content = raw;
  turnCount++;

  const auto = document.getElementById('auto-reminder').checked;
  const every = parseInt(document.getElementById('reminder-every').value) || 10;
  if (auto && turnCount % every === 0) {
    content += '\n\n' + document.getElementById('reminder-text').value;
  }

  const userMsg = { role: 'user', content, display: raw };
  messages.push(userMsg);
  appendMessage(userMsg);
  inputEl.value = '';
  loading = true;
  updateSendBtn();
  updateTurnInfo();
  showLoading();

  try {
    const sysPmt = document.getElementById('system-prompt').value.trim();
    const model = document.getElementById('model-select').value;
    const temp = parseFloat(document.getElementById('temp').value);
    const maxTok = parseInt(document.getElementById('max-tokens').value);

    const apiMsgs = [
      ...(sysPmt ? [{ role: 'system', content: sysPmt }] : []),
      ...messages.map(m => ({ role: m.role, content: m.content })),
    ];

    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({ model, messages: apiMsgs, temperature: temp, max_tokens: maxTok }),
    });

    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.error?.message || `API Error ${res.status}`);
    }
    const data = await res.json();
    const reply = data.choices[0]?.message?.content || '';
    const dmMsg = { role: 'assistant', content: reply, display: reply };
    messages.push(dmMsg);
    hideLoading();
    appendMessage(dmMsg);
    saveAll();
  } catch (e) {
    hideLoading();
    const area = document.getElementById('chat-area');
    const errEl = document.createElement('div');
    errEl.className = 'err-box';
    errEl.textContent = '❌ ' + e.message;
    area.appendChild(errEl);
    area.scrollTop = area.scrollHeight;
  } finally {
    loading = false;
    updateSendBtn();
  }
}

function clearChat() {
  if (!confirm('確定清除所有對話？')) return;
  messages = [];
  turnCount = 0;
  document.getElementById('chat-area').innerHTML = `
    <div class="empty">
      <div class="empty-icon">⟢</div>
      <div class="empty-title">劇情模擬器</div>
      <div class="empty-sub">在設定裡貼入 API Key 和 System Prompt，然後開始</div>
    </div>`;
  updateTurnInfo();
  saveAll();
}

// ─── Compress ─────────────────────────────────────────────────────────────────
function renderCompressList() {
  selectedSet = new Set();
  selectHalf();
  const list = document.getElementById('compress-list');
  list.innerHTML = '';
  messages.forEach((m, i) => {
    const item = document.createElement('div');
    item.className = `c-item${selectedSet.has(i) ? ' sel' : ''}`;
    item.dataset.idx = i;
    item.onclick = () => toggleSel(i, item);
    item.innerHTML = `
      <div class="cbox${selectedSet.has(i) ? ' on' : ''}" id="cbox-${i}">${selectedSet.has(i) ? '✓' : ''}</div>
      <div class="c-info">
        <span class="c-role ${m.role === 'user' ? 'user' : 'dm'}">${m.role === 'user' ? '玩家' : 'DM'} #${i+1}${m.isSummary ? ' 📁' : ''}</span>
        <span class="c-preview">${(m.display || m.content).slice(0, 80)}…</span>
      </div>`;
    list.appendChild(item);
  });
  updateSelUI();
}

function toggleSel(i, item) {
  if (selectedSet.has(i)) { selectedSet.delete(i); item.classList.remove('sel'); }
  else { selectedSet.add(i); item.classList.add('sel'); }
  const box = document.getElementById('cbox-' + i);
  if (box) { box.className = `cbox${selectedSet.has(i) ? ' on' : ''}`; box.textContent = selectedSet.has(i) ? '✓' : ''; }
  updateSelUI();
}

function selectHalf() {
  const half = Math.floor(messages.length / 2);
  selectedSet = new Set(Array.from({ length: half }, (_, i) => i));
  document.querySelectorAll('.c-item').forEach((el, i) => {
    const on = selectedSet.has(i);
    el.classList.toggle('sel', on);
    const box = document.getElementById('cbox-' + i);
    if (box) { box.className = `cbox${on ? ' on' : ''}`; box.textContent = on ? '✓' : ''; }
  });
  updateSelUI();
}

function clearSel() {
  selectedSet = new Set();
  document.querySelectorAll('.c-item').forEach(el => {
    el.classList.remove('sel');
    const i = el.dataset.idx;
    const box = document.getElementById('cbox-' + i);
    if (box) { box.className = 'cbox'; box.textContent = ''; }
  });
  updateSelUI();
}

function updateSelUI() {
  const n = selectedSet.size;
  document.getElementById('sel-count').textContent = `已選 ${n} 條`;
  const btn = document.getElementById('compress-btn');
  btn.textContent = n ? `壓縮選中的 ${n} 條` : '壓縮選中的 0 條';
  btn.disabled = !n;
}

async function compressSelected() {
  if (!selectedSet.size) return;
  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) { alert('請先填入 API Key'); return; }

  const btn = document.getElementById('compress-btn');
  btn.textContent = '壓縮中…';
  btn.disabled = true;

  const indices = [...selectedSet].sort((a, b) => a - b);
  const toCompress = indices.map(i => messages[i]);
  const text = toCompress.map(m => `[${m.role === 'user' ? '玩家' : 'DM'}]: ${m.content}`).join('\n\n---\n\n');

  try {
    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: '你是劇情摘要助手。將對話壓縮成詳細的繁體中文劇情摘要，保留所有重要情節、人物關係、屬性數值和關鍵對話，讓故事可以無縫繼續。' },
          { role: 'user', content: `請壓縮以下對話：\n\n${text}` },
        ],
        temperature: 0.3,
        max_tokens: 3000,
      }),
    });
    const data = await res.json();
    const summary = data.choices[0]?.message?.content || '';

    const summaryMsg = {
      role: 'user',
      content: `【📁 劇情摘要（已壓縮 ${indices.length} 條）】\n\n${summary}\n\n請以此摘要為背景繼續故事。`,
      display: `【📁 劇情摘要（已壓縮 ${indices.length} 條）】\n\n${summary}`,
      isSummary: true,
    };

    const kept = messages.filter((_, i) => !selectedSet.has(i));
    const at = Math.min(...indices);
    messages = [...kept.slice(0, at), summaryMsg, ...kept.slice(at)];

    // Re-render chat
    const area = document.getElementById('chat-area');
    area.innerHTML = '';
    messages.forEach(m => appendMessage(m));

    selectedSet = new Set();
    saveAll();
    showTab('chat');
  } catch (e) {
    alert('壓縮失敗：' + e.message);
    updateSelUI();
  }
}

// ─── Storage ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'sim_v1';

function saveAll() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      messages,
      turnCount,
      apiKey: document.getElementById('api-key').value,
      systemPrompt: document.getElementById('system-prompt').value,
      reminderText: document.getElementById('reminder-text').value,
      model: document.getElementById('model-select').value,
      temperature: document.getElementById('temp').value,
      maxTokens: document.getElementById('max-tokens').value,
      autoReminder: document.getElementById('auto-reminder').checked,
      reminderEvery: document.getElementById('reminder-every').value,
    }));
  } catch(e) { console.warn('儲存失敗', e); }
}

function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.apiKey) document.getElementById('api-key').value = d.apiKey;
    if (d.systemPrompt) document.getElementById('system-prompt').value = d.systemPrompt;
    if (d.reminderText) document.getElementById('reminder-text').value = d.reminderText;
    if (d.model) document.getElementById('model-select').value = d.model;
    if (d.temperature) { document.getElementById('temp').value = d.temperature; document.getElementById('temp-val').textContent = d.temperature; }
    if (d.maxTokens) { document.getElementById('max-tokens').value = d.maxTokens; document.getElementById('tokens-val').textContent = d.maxTokens; }
    if (d.autoReminder !== undefined) document.getElementById('auto-reminder').checked = d.autoReminder;
    if (d.reminderEvery) document.getElementById('reminder-every').value = d.reminderEvery;
    if (d.messages && d.messages.length) {
      messages = d.messages;
      turnCount = d.turnCount || 0;
      const area = document.getElementById('chat-area');
      area.innerHTML = '';
      messages.forEach(m => appendMessage(m));
    }
  } catch(e) { console.warn('載入失敗', e); }
}

// ─── Export ───────────────────────────────────────────────────────────────────
function exportChat() {
  if (!messages.length) { alert('目前沒有對話內容'); return; }
  const lines = [];
  lines.push('# 江南重逢倒數｜對話記錄');
  lines.push(`匯出時間：${new Date().toLocaleString('zh-TW')}`);
  lines.push(`共 ${messages.length} 條訊息 / 第 ${turnCount} 輪`);
  lines.push('\n' + '─'.repeat(50) + '\n');
  messages.forEach((m, i) => {
    const role = m.role === 'user' ? '玩家' : 'DM';
    const tag = m.isSummary ? '（摘要）' : '';
    lines.push(`## [${i + 1}] ${role}${tag}`);
    lines.push(m.display || m.content);
    lines.push('\n' + '─'.repeat(50) + '\n');
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `江南重逢倒數_${new Date().toISOString().slice(0,10)}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
loadAll();
updateTurnInfo();
updateSendBtn();
document.getElementById('auto-reminder').addEventListener('change', () => { updateTurnInfo(); saveAll(); });
document.getElementById('reminder-every').addEventListener('input', () => { updateTurnInfo(); saveAll(); });
['api-key','system-prompt','reminder-text','model-select','temp','max-tokens'].forEach(id => {
  document.getElementById(id).addEventListener('change', saveAll);
  document.getElementById(id).addEventListener('input', saveAll);
});
</script>

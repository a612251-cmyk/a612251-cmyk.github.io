<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans TC', sans-serif; background: #0a0a0a; color: #e0e0e0; overflow: hidden; }
    a { color: #6ba3ff; } a:hover { color: #93bcff; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes liveDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 8px rgba(200,160,255,0.3); } 50% { box-shadow: 0 0 16px rgba(200,160,255,0.5); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    select option { background: #1a1a1a; color: #e0e0e0; }
    @media (max-width: 600px) {
      .api-row { flex-direction: column !important; }
      .api-row > div:last-child { width: 100% !important; }
      .char-grid { grid-template-columns: 1fr !important; }
      .member-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .relation-grid { grid-template-columns: 1fr !important; }
      .topbar-title { display: none !important; }
      .stats-wrap { gap: 8px !important; }
      .stats-wrap > div { min-width: 45% !important; }
    }
  </style>
</helmet>

<!-- SETUP SCREEN -->
<sc-if value="{{ showSetup }}" hint-placeholder-val="{{ true }}">
  <div style="width: 100vw; height: 100dvh; overflow-y: auto; display: flex; align-items: flex-start; justify-content: center; background: linear-gradient(145deg, #0a0a0a 0%, #1a1020 50%, #0a0a0a 100%);">
    <div style="width: 560px; max-width: 92vw; padding: 32px 0 60px; animation: fadeIn 0.6s ease;">

      <!-- Title -->
      <div style="text-align: center; margin-bottom: 36px;">
        <div style="font-size: 14px; color: #8a6abf; font-weight: 500; letter-spacing: 4px; margin-bottom: 8px;">NCT DREAM</div>
        <h1 style="font-size: 32px; font-weight: 900; color: #fff; letter-spacing: -0.5px;">妹妹模擬器</h1>
        <p style="font-size: 13px; color: #555; margin-top: 8px;">從兄妹關係到心動瞬間——青春悸動 × 現實壓力 × 家族羈絆</p>
      </div>

      <!-- API Settings -->
      <div style="background: #141414; border: 1px solid #222; border-radius: 12px; padding: 24px; margin-bottom: 16px;">
        <div style="font-size: 12px; color: #8a6abf; font-weight: 600; letter-spacing: 1px; margin-bottom: 16px;">⚙ API 設定</div>
        <div class="api-row" style="display: flex; gap: 12px;">
          <div style="flex: 1;">
            <label style="display: block; font-size: 12px; color: #666; margin-bottom: 6px;">DeepSeek API Key</label>
            <input type="password" placeholder="sk-..." value="{{ apiKey }}" onChange="{{ onApiKeyChange }}"
              style="width: 100%; padding: 10px 12px; background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; font-size: 16px; font-family: 'JetBrains Mono', monospace; outline: none;"
              style-focus="border-color: #8a6abf;" />
          </div>
          <div style="width: 180px;">
            <label style="display: block; font-size: 12px; color: #666; margin-bottom: 6px;">模型</label>
            <select value="{{ model }}" onChange="{{ onModelChange }}"
              style="width: 100%; padding: 10px 12px; background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; font-size: 16px; font-family: 'Noto Sans TC', sans-serif; outline: none; cursor: pointer;">
              <option value="deepseek-chat">DeepSeek Chat</option>
              <option value="deepseek-reasoner">DeepSeek Reasoner</option>
              <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Character Creation -->
      <div style="background: #141414; border: 1px solid #222; border-radius: 12px; padding: 24px; margin-bottom: 16px;">
        <div style="font-size: 12px; color: #e8a0bf; font-weight: 600; letter-spacing: 1px; margin-bottom: 16px;">👤 角色設定</div>
        <div class="char-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
          <div>
            <label style="display: block; font-size: 12px; color: #666; margin-bottom: 6px;">你的名字</label>
            <input type="text" placeholder="請輸入角色名" value="{{ charName }}" onChange="{{ onCharNameChange }}"
              style="width: 100%; padding: 10px 12px; background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; font-size: 13px; outline: none; font-family: 'Noto Sans TC', sans-serif;"
              style-focus="border-color: #e8a0bf;" />
          </div>
          <div>
            <label style="display: block; font-size: 12px; color: #666; margin-bottom: 6px;">年齡</label>
            <input type="number" placeholder="18" value="{{ charAge }}" onChange="{{ onCharAgeChange }}" min="16" max="28"
              style="width: 100%; padding: 10px 12px; background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; font-size: 13px; outline: none; font-family: 'Noto Sans TC', sans-serif;"
              style-focus="border-color: #e8a0bf;" />
          </div>
        </div>
        <div style="margin-bottom: 14px;">
          <label style="display: block; font-size: 12px; color: #666; margin-bottom: 6px;">性格描述（簡短）</label>
          <input type="text" placeholder="例如：倔強但心軟、表面冷靜內心敏感..." value="{{ charPersonality }}" onChange="{{ onCharPersonalityChange }}"
            style="width: 100%; padding: 10px 12px; background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; font-size: 13px; outline: none; font-family: 'Noto Sans TC', sans-serif;"
            style-focus="border-color: #e8a0bf;" />
        </div>
        <div>
          <label style="display: block; font-size: 12px; color: #666; margin-bottom: 6px;">背景補充（選填）</label>
          <textarea placeholder="例如：從小喜歡畫畫、在首爾讀大學、對偶像圈不太了解..." value="{{ charBackground }}" onChange="{{ onCharBackgroundChange }}"
            style="width: 100%; height: 70px; padding: 10px 12px; background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; font-size: 13px; outline: none; resize: none; line-height: 1.6; font-family: 'Noto Sans TC', sans-serif;"
            style-focus="border-color: #e8a0bf;"></textarea>
        </div>
      </div>

      <!-- Brother Selection -->
      <div style="background: #141414; border: 1px solid #222; border-radius: 12px; padding: 24px; margin-bottom: 16px;">
        <div style="font-size: 12px; color: #a0c4ff; font-weight: 600; letter-spacing: 1px; margin-bottom: 16px;">💫 選擇你的哥哥</div>
        <div class="member-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
          <sc-for list="{{ memberOptions }}" as="mem">
            <button onClick="{{ mem.onClick }}" style="{{ mem.style }}"
              style-hover="border-color: #8a6abf; background: #1a1020;">
              <div style="font-size: 20px; margin-bottom: 4px;">{{ mem.emoji }}</div>
              <div style="font-size: 13px; font-weight: 600; color: #e0e0e0;">{{ mem.name }}</div>
              <div style="font-size: 10px; color: #888; margin-top: 2px;">{{ mem.type }}</div>
            </button>
          </sc-for>
        </div>
      </div>

      <!-- Relationship Type -->
      <div style="background: #141414; border: 1px solid #222; border-radius: 12px; padding: 24px; margin-bottom: 16px;">
        <div style="font-size: 12px; color: #ffd6a5; font-weight: 600; letter-spacing: 1px; margin-bottom: 16px;">🔗 關係起點</div>
        <div class="relation-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <sc-for list="{{ relationOptions }}" as="rel">
            <button onClick="{{ rel.onClick }}" style="{{ rel.style }}"
              style-hover="border-color: #8a6abf; background: #1a1020;">
              <div style="font-size: 13px; font-weight: 600; color: #e0e0e0;">{{ rel.label }}</div>
              <div style="font-size: 11px; color: #777; margin-top: 3px; line-height: 1.4;">{{ rel.desc }}</div>
            </button>
          </sc-for>
        </div>
      </div>

      <!-- Route Selection -->
      <div style="background: #141414; border: 1px solid #222; border-radius: 12px; padding: 24px; margin-bottom: 20px;">
        <div style="font-size: 12px; color: #ff9eaa; font-weight: 600; letter-spacing: 1px; margin-bottom: 16px;">💕 劇情路線</div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <sc-for list="{{ routeOptions }}" as="route">
            <button onClick="{{ route.onClick }}" style="{{ route.style }}"
              style-hover="border-color: #8a6abf; background: #1a1020;">
              <div style="font-size: 13px; font-weight: 600; color: #e0e0e0;">{{ route.label }}</div>
              <div style="font-size: 11px; color: #777; margin-top: 2px;">{{ route.desc }}</div>
            </button>
          </sc-for>
        </div>
      </div>

      <!-- Start Button -->
      <button onClick="{{ onGenerate }}"
        style="width: 100%; padding: 16px; background: linear-gradient(135deg, #8a6abf, #e8a0bf); border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.3s; animation: glow 3s infinite;"
        style-hover="transform: translateY(-2px); box-shadow: 0 4px 20px rgba(138,106,191,0.4);"
        style-active="transform: translateY(0);">
        🎬 開始故事
      </button>
    </div>
  </div>
</sc-if>

<!-- LOADING OVERLAY -->
<sc-if value="{{ showLoading }}" hint-placeholder-val="{{ false }}">
  <div style="position: fixed; inset: 0; background: rgba(0,0,0,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;">
    <div style="width: 48px; height: 48px; border: 3px solid #222; border-top-color: #8a6abf; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    <p style="margin-top: 20px; color: #888; font-size: 14px;">{{ loadingText }}</p>
  </div>
</sc-if>

<!-- ERROR OVERLAY -->
<sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
  <div style="position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div style="background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 28px; max-width: 440px; text-align: center;">
      <div style="font-size: 36px; margin-bottom: 12px;">⚠️</div>
      <p style="color: #e0e0e0; font-size: 14px; line-height: 1.6; margin-bottom: 20px; word-break: break-all;">{{ errorMsg }}</p>
      <button onClick="{{ dismissError }}"
        style="padding: 10px 28px; background: #8a6abf; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer;"
        style-hover="background: #9b7bd0;">
        確定
      </button>
    </div>
  </div>
</sc-if>

<!-- MAIN SIMULATOR -->
<sc-if value="{{ showSimulator }}" hint-placeholder-val="{{ false }}">
  <div style="width: 100vw; height: 100dvh; display: flex; flex-direction: column; background: #0a0a0a;">
    <!-- Top Bar -->
    <div style="height: 52px; min-height: 52px; background: #111; border-bottom: 1px solid #1e1e1e; display: flex; align-items: center; padding: 0 16px; gap: 12px;">
      <span style="font-size: 18px;">🎭</span>
      <span class="topbar-title" style="font-size: 14px; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;">{{ storyTitle }}</span>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
        <button onClick="{{ toggleStats }}"
          style="padding: 5px 12px; background: #1a1020; border: 1px solid #2a2040; border-radius: 6px; color: #c8a0ff; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer;"
          style-hover="background: #2a2040;">
          📊 屬性
        </button>
        <button onClick="{{ onReset }}"
          style="padding: 5px 12px; background: transparent; border: 1px solid #282828; border-radius: 6px; color: #666; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer;"
          style-hover="border-color: #444; color: #999;">
          重新開始
        </button>
      </div>
    </div>

    <!-- Stats Bar (collapsible) -->
    <sc-if value="{{ showStats }}" hint-placeholder-val="{{ false }}">
      <div style="background: #111; border-bottom: 1px solid #1e1e1e; padding: 10px 16px; animation: fadeIn 0.2s ease;">
        {{ statsBar }}
      </div>
    </sc-if>

    <!-- Filter Tabs -->
    <div style="min-height: 40px; background: #0f0f0f; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; padding: 0 14px; gap: 4px; overflow-x: auto;">
      <sc-for list="{{ filterTabs }}" as="ft">
        <button onClick="{{ ft.onClick }}" style="{{ ft.style }}"
          style-hover="background: #1a1a2e; color: #b0b0ff;">
          {{ ft.label }}
        </button>
      </sc-for>
    </div>

    <!-- Timeline Feed -->
    <div style="flex: 1; overflow-y: auto; padding: 0 0 20px;" ref="{{ feedRef }}">
      {{ feedContent }}
    </div>

    <!-- Interaction Bar -->
    <sc-if value="{{ showInteraction }}">
      <div style="background: #111; border-top: 1px solid #1e1e1e; flex-shrink: 0;">
        <sc-if value="{{ hasChoices }}">
          <div style="display: flex; gap: 8px; padding: 10px 16px 0; overflow-x: auto; -webkit-overflow-scrolling: touch;">
            <sc-for list="{{ choices }}" as="choice">
              <button onClick="{{ choice.onClick }}"
                style="padding: 7px 16px; background: #1a1020; border: 1px solid #2a2040; border-radius: 20px; color: #c8a0ff; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;"
                style-hover="background: #2a2040; border-color: #4a3060; color: #e0c0ff;">
                {{ choice.text }}
              </button>
            </sc-for>
          </div>
        </sc-if>
        <div style="display: flex; gap: 8px; align-items: center; padding: 10px 16px;">
          <input type="text" placeholder="輸入你的行動或對話..." value="{{ userInput }}" onChange="{{ onUserInputChange }}" onKeyDown="{{ onUserInputKeyDown }}"
            style="flex: 1; padding: 10px 14px; background: #0a0a0a; border: 1px solid #222; border-radius: 8px; color: #fff; font-size: 16px; font-family: 'Noto Sans TC', sans-serif; outline: none; min-width: 0;"
            style-focus="border-color: #8a6abf;" />
          <button onClick="{{ onContinueStory }}"
            style="padding: 10px 14px; background: linear-gradient(135deg, #8a6abf, #e8a0bf); border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; white-space: nowrap; flex-shrink: 0;"
            style-hover="opacity: 0.9;">
            ▶
          </button>
        </div>
      </div>
    </sc-if>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;100%&quot;},
  &quot;temperature&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;min&quot;: 0, &quot;max&quot;: 2, &quot;step&quot;: 0.1, &quot;default&quot;: 0.9, &quot;section&quot;: &quot;AI 設定&quot;}
}">

class Component extends DCLogic {
  state = {
    screen: 'setup',
    apiKey: localStorage.getItem('ds_api_key') || '',
    model: localStorage.getItem('ds_model') || 'deepseek-chat',
    // Character creation
    charName: '',
    charAge: '19',
    charPersonality: '',
    charBackground: '',
    selectedMember: 'renjun',
    selectedRelation: 'real_sister',
    selectedRoute: 'brother_love',
    // Game state
    storyData: null,
    allEvents: [],
    stats: { love_sibling: 15, love_romance: 0, popularity: 5, mood: 80, secret_safety: 95, company_alert: 5, public_heat: 3 },
    filterPlatform: 'all',
    userInput: '',
    errorMsg: '',
    showError: false,
    isLoading: false,
    loadingText: 'AI 正在構思劇情...',
    showStatsPanel: true,
    conversationHistory: [],
  };

  feedRef = React.createRef();

  // Persistence
  SAVE_KEY = 'story_sim_save';

  componentDidMount() {
    this.loadSave();
  }

  saveToDisk() {
    const s = this.state;
    if (s.screen !== 'simulator' || !s.storyData) return;
    const save = {
      storyData: s.storyData,
      allEvents: s.allEvents,
      stats: s.stats,
      conversationHistory: s.conversationHistory,
      charName: s.charName,
      charAge: s.charAge,
      charPersonality: s.charPersonality,
      charBackground: s.charBackground,
      selectedMember: s.selectedMember,
      selectedRelation: s.selectedRelation,
      selectedRoute: s.selectedRoute,
      savedAt: Date.now(),
    };
    try {
      localStorage.setItem(this.SAVE_KEY, JSON.stringify(save));
    } catch(e) {
      console.warn('存檔失敗', e);
    }
  }

  loadSave() {
    try {
      const raw = localStorage.getItem(this.SAVE_KEY);
      if (!raw) return;
      const save = JSON.parse(raw);
      if (!save.storyData || !save.allEvents?.length) return;
      this.setState({
        screen: 'simulator',
        storyData: save.storyData,
        allEvents: save.allEvents,
        stats: save.stats || this.state.stats,
        conversationHistory: save.conversationHistory || [],
        charName: save.charName || '',
        charAge: save.charAge || '19',
        charPersonality: save.charPersonality || '',
        charBackground: save.charBackground || '',
        selectedMember: save.selectedMember || 'renjun',
        selectedRelation: save.selectedRelation || 'real_sister',
        selectedRoute: save.selectedRoute || 'brother_love',
      });
    } catch(e) {
      console.warn('讀檔失敗', e);
    }
  }

  clearSave() {
    localStorage.removeItem(this.SAVE_KEY);
  }

  members = {
    renjun: { name: '黃仁俊', emoji: '🎨', type: '清醒藝術型', en: 'Renjun' },
    jeno: { name: '李帝努', emoji: '🐕', type: '穩定犬系型', en: 'Jeno' },
    haechan: { name: '李楷燦', emoji: '☀️', type: '明亮危險型', en: 'Haechan' },
    jaemin: { name: '羅渽民', emoji: '🌹', type: '溫柔掌控型', en: 'Jaemin' },
    chenle: { name: '鍾辰樂', emoji: '🏀', type: '直率現實型', en: 'Chenle' },
    jisung: { name: '朴志晟', emoji: '🐹', type: '成長慢熱型', en: 'Jisung' },
  };

  relations = [
    { key: 'real_sister', label: '親妹妹', desc: '從小一起長大，血濃於水' },
    { key: 'cousin', label: '表/堂妹', desc: '親戚關係，假期住在一起' },
    { key: 'childhood', label: '青梅竹馬', desc: '鄰居妹妹，像兄妹一樣' },
    { key: 'trainee', label: '公司練習生', desc: 'SM練習生，他是你前輩' },
    { key: 'adopted', label: '重組家庭', desc: '家庭重組的新妹妹' },
    { key: 'sponsored', label: '資助學生', desc: '被家庭資助，像妹妹的存在' },
  ];

  routes = [
    { key: 'brother_love', label: '🔥 兄妹戀愛線', desc: '與哥哥從兄妹發展為戀人（真骨/偽骨科）' },
    { key: 'teammate_love', label: '💫 哥哥的隊友線', desc: '與哥哥的某位隊友發展戀情' },
    { key: 'sibling_only', label: '🏠 純兄妹線', desc: '永遠做彼此最重要的家人' },
  ];

  platformMeta = {
    narration: { icon: '📖', label: '劇情', color: '#b8a080' },
    ptt: { icon: '💬', label: 'PTT', color: '#2d5a27' },
    line: { icon: '💬', label: 'LINE', color: '#06C755' },
    ig: { icon: '📷', label: 'IG', color: '#E1306C' },
    fb: { icon: '👥', label: 'FB', color: '#1877F2' },
    live: { icon: '🔴', label: '直播', color: '#e74c3c' },
    twitter: { icon: '𝕏', label: 'X', color: '#1DA1F2' },
    news: { icon: '📰', label: '新聞', color: '#c0392b' },
    stats: { icon: '📊', label: '屬性', color: '#8a6abf' },
  };

  buildSystemPrompt() {
    const s = this.state;
    const member = this.members[s.selectedMember];
    const relation = this.relations.find(r => r.key === s.selectedRelation);
    const route = this.routes.find(r => r.key === s.selectedRoute);
    const isMinor = parseInt(s.charAge) < 18;

    return `你是「妹妹模擬器」的 DM（任務引導者），負責劇情推進、NPC扮演、任務發布、事件生成與屬性結算。

## 玩家角色
- 名字：${s.charName}
- 年齡：${s.charAge}歲${isMinor ? '（未成年，戀愛線自動鎖定，僅進行兄妹/友情線）' : ''}
- 性格：${s.charPersonality || '待玩家展現'}
- 背景：${s.charBackground || '普通背景'}

## 哥哥
- ${member.name}（${member.en}）· NCT DREAM 成員

## 關係設定
- 起點：${relation.label}（${relation.desc}）
- 路線：${route.label}

## 當前屬性值
- 好感度(兄妹)：${s.stats.love_sibling}/100

## 核心規則
1. 劇情生動有張力，角色對話自然口語化，符合各成員性格
2. 每段生成 8-15 個 events，必須穿插 narration 旁白描述場景/心理
3. 屬性值循序漸進，不允許突然猛漲或猛減（每次變化±3~8）
4. 恋愛好感度不能超過兄妹好感度
5. 提供 2-4 個選擇讓玩家決定行動
6. 使用繁體中文
7. 每段正文結尾必須包含一個 stats 類型事件，顯示屬性變化
8. ${isMinor ? '玩家未成年，所有互動僅限兄妹/友情，不得出現戀愛暧昧' : '所有親密關係必須發生在成年角色之間'}
9. 角色要有不同的 color 值用於 UI 顯示`;

  safeParseJSON(str) {
    try { return JSON.parse(str); } catch(e1) {}
    let cleaned = str.replace(/,\s*([}\]])/g, '$1');
    try { return JSON.parse(cleaned); } catch(e2) {}
    cleaned = cleaned.replace(/\r\n?/g, '\n');
    let result = '';
    let inString = false;
    let escaped = false;
    for (let i = 0; i < cleaned.length; i++) {
      const ch = cleaned[i];
      if (escaped) { result += ch; escaped = false; continue; }
      if (ch === '\\') { result += ch; escaped = true; continue; }
      if (ch === '"') { inString = !inString; result += ch; continue; }
      if (inString && ch === '\n') { result += '\\n'; continue; }
      if (inString && ch === '\t') { result += '\\t'; continue; }
      result += ch;
    }
    try { return JSON.parse(result); } catch(e3) {}
    result = result.replace(/,\s*([}\]])/g, '$1');
    try { return JSON.parse(result); } catch(e4) {
      // Last resort: try to fix unquoted keys more aggressively
      let lastTry = result.replace(/([{,]\s*)([a-zA-Z_]\w*)\s*:/g, '$1"$2":');
      lastTry = lastTry.replace(/:\s*'([^']*)'/g, ':"$1"');
      try { return JSON.parse(lastTry); } catch(e5) {
        throw new Error(`JSON 解析失敗。原始回傳前 300 字：\n${str.slice(0, 300)}`);
      }
    }
  }

  async callDeepSeek(messages) {
    const isReasoner = this.state.model === 'deepseek-reasoner';
    const body = {
      model: this.state.model,
      messages,
      max_tokens: 4000,
    };
    // reasoner doesn't support temperature or response_format
    if (!isReasoner) {
      body.temperature = this.props.temperature ?? 0.9;
      body.response_format = { type: 'json_object' };
    }
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.state.apiKey}` },
      body: JSON.stringify(body),
    });
    if (!res.ok) { const err = await res.text(); throw new Error(`API 錯誤 (${res.status}): ${err}`); }
    const data = await res.json();
    const choice = data.choices[0];
    const content = choice.message.content || '';
    if (!content.trim()) {
      throw new Error('API 回傳空內容，可能是 token 不足或模型問題');
    }
    return content;
  }

  extractJSON(raw) {
    let jsonStr = raw;
    const jsonMatch = raw.match(/```json\s*([\s\S]*?)```/) || raw.match(/```\s*([\s\S]*?)```/);
    if (jsonMatch) jsonStr = jsonMatch[1];
    const braceStart = jsonStr.indexOf('{');
    const braceEnd = jsonStr.lastIndexOf('}');
    if (braceStart !== -1 && braceEnd !== -1) jsonStr = jsonStr.slice(braceStart, braceEnd + 1);
    return this.safeParseJSON(jsonStr);
  }

  applyStatsChange(changes) {
    if (!changes) return;
    const stats = { ...this.state.stats };
    Object.keys(changes).forEach(key => {
      if (stats[key] !== undefined) {
        stats[key] = Math.max(0, Math.min(100, stats[key] + (changes[key] || 0)));
      }
    });
    this.setState({ stats });
  }

  async generateStory() {
    this.setState({ isLoading: true, loadingText: 'AI 正在構思開場劇情...' });
    const systemPrompt = this.buildSystemPrompt();
    const member = this.members[this.state.selectedMember];
    const userMsg = `遊戲開始！請生成第一段劇情。
角色「${this.state.charName}」是 ${member.name} 的${this.relations.find(r => r.key === this.state.selectedRelation).label}。
請從日常生活場景開始，自然地引入角色關係，展示兄妹/類兄妹的日常互動。
設定合理的初始場景（如：某天放學回家/去宿舍找哥哥/第一次見面等），讓故事自然展開。`;

    const messages = [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: userMsg },
    ];
    try {
      const raw = await this.callDeepSeek(messages);
      const storyData = this.extractJSON(raw);
      if (storyData.stats_change) this.applyStatsChange(storyData.stats_change);
      this.setState({
        screen: 'simulator',
        isLoading: false,
        storyData,
        allEvents: storyData.events || [],
        conversationHistory: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userMsg },
          { role: 'assistant', content: raw },
        ],
      }, () => this.saveToDisk());
    } catch (e) {
      this.setState({ isLoading: false, showError: true, errorMsg: `生成失敗：${e.message}` });
    }
  }

  // Summarize old conversation to save tokens — keep only last 2 exchanges
  trimConversation(history) {
    // history[0] = system, then pairs of user/assistant
    if (history.length <= 5) return history; // system + 2 pairs = 5 msgs, no need to trim
    const system = history[0];
    const pairs = history.slice(1);
    // Keep last 4 messages (2 exchanges), summarize the rest into a compact recap
    const oldPairs = pairs.slice(0, -4);
    const recentPairs = pairs.slice(-4);
    // Build a compact summary of old exchanges
    let recap = '【前情摘要】以下是之前的劇情重點：\n';
    for (let i = 0; i < oldPairs.length; i += 2) {
      const userMsg = oldPairs[i]?.content || '';
      const assistantMsg = oldPairs[i + 1]?.content || '';
      // Extract title from assistant JSON if possible
      try {
        const parsed = this.extractJSON(assistantMsg);
        if (parsed.title) recap += `- ${parsed.title}\n`;
      } catch(e) {
        recap += `- (劇情段落)\n`;
      }
    }
    return [
      system,
      { role: 'user', content: recap },
      { role: 'assistant', content: '好的，我了解前情摘要，會延續劇情。' },
      ...recentPairs,
    ];
  }

  async continueStory(input) {
    this.setState({ isLoading: true, loadingText: 'AI 正在推進劇情...' });
    const updatedSystem = this.buildSystemPrompt();
    const prompt = input || '請繼續推進劇情，生成下一段 events。延續角色和故事線。';
    const history = this.trimConversation([...this.state.conversationHistory]);
    history[0] = { role: 'system', content: updatedSystem };
    const messages = [...history, { role: 'user', content: prompt }];

    try {
      const raw = await this.callDeepSeek(messages);
      const newData = this.extractJSON(raw);
      if (newData.stats_change) this.applyStatsChange(newData.stats_change);
      const newEvents = (newData.events || []).map((e, i) => ({ ...e, id: this.state.allEvents.length + i + 1 }));
      const allEvents = [...this.state.allEvents, ...newEvents];
      this.setState({
        isLoading: false,
        storyData: { ...this.state.storyData, title: newData.title || this.state.storyData?.title, choices: newData.choices || [] },
        allEvents,
        conversationHistory: [...messages, { role: 'assistant', content: raw }],
      }, () => this.saveToDisk());
    } catch (e) {
      this.setState({ isLoading: false, showError: true, errorMsg: `推進失敗：${e.message}` });
    }
  }

        React.createElement('span', { style: { color: '#ccc', fontSize: 13 } }, m.content),
      );
    });
    return React.createElement('div', { style: { background: '#111', borderRadius: 10, overflow: 'hidden', maxWidth: '100%' } },
      React.createElement('div', { style: { background: 'linear-gradient(135deg, #1a1a2e, #16213e)', padding: '28px 16px', textAlign: 'center', position: 'relative' } },
        React.createElement('div', { style: { position: 'absolute', top: 10, left: 10, display: 'flex', alignItems: 'center', gap: 5 } },
          React.createElement('span', { style: { width: 8, height: 8, background: '#e74c3c', borderRadius: '50%', display: 'inline-block', animation: 'liveDot 1.5s infinite' } }),
          React.createElement('span', { style: { color: '#e74c3c', fontSize: 11, fontWeight: 600 } }, 'LIVE'),
        ),
        React.createElement('div', { style: { position: 'absolute', top: 10, right: 10, color: '#888', fontSize: 11 } }, `👁 ${d.viewers || 0}`),
        React.createElement('div', { style: { width: 44, height: 44, borderRadius: '50%', background: this.getCharColor(d.streamerId), display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: 18, fontWeight: 700, margin: '0 auto 8px' } }, (d.streamer || '?')[0]),
        React.createElement('div', { style: { color: '#fff', fontSize: 14, fontWeight: 600 } }, d.streamer),
        React.createElement('div', { style: { color: '#aaa', fontSize: 12, marginTop: 2 } }, d.title),
      ),
      React.createElement('div', { style: { padding: '10px 14px' } }, chatEls),
    );
  }

  renderTwitterCard(d) {
    return React.createElement('div', { style: { background: '#000', border: '1px solid #2f3336', borderRadius: 10, overflow: 'hidden', maxWidth: '100%' } },
      React.createElement('div', { style: { padding: '14px', display: 'flex', gap: 10 } },
        React.createElement('div', { style: { width: 36, height: 36, borderRadius: '50%', background: this.getCharColor(d.authorId), display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: 15, fontWeight: 700, flexShrink: 0 } }, (d.author || '?')[0]),
        React.createElement('div', { style: { flex: 1 } },
          React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 4 } },
            React.createElement('span', { style: { color: '#e7e9ea', fontSize: 14, fontWeight: 700 } }, d.author),
            React.createElement('span', { style: { color: '#71767b', fontSize: 13 } }, d.handle),
          ),
          React.createElement('p', { style: { color: '#e7e9ea', fontSize: 15, lineHeight: 1.5, marginTop: 4, whiteSpace: 'pre-wrap' } }, d.content),
          React.createElement('div', { style: { display: 'flex', gap: 40, marginTop: 10 } },
            React.createElement('span', { style: { color: '#71767b', fontSize: 13 } }, `💬 ${(d.replies || []).length}`),
            React.createElement('span', { style: { color: '#71767b', fontSize: 13 } }, `🔁 ${d.retweets || 0}`),
            React.createElement('span', { style: { color: '#71767b', fontSize: 13 } }, `♡ ${d.likes || 0}`),
          ),
        ),
      ),
      ...(d.replies || []).map((r, j) =>
        React.createElement('div', { key: j, style: { borderTop: '1px solid #2f3336', padding: '10px 14px', display: 'flex', gap: 8 } },
          React.createElement('div', { style: { width: 28, height: 28, borderRadius: '50%', background: '#333', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#aaa', fontSize: 12, flexShrink: 0 } }, (r.author || '?')[0]),
          React.createElement('div', null,
            React.createElement('span', { style: { color: '#e7e9ea', fontSize: 13, fontWeight: 600, marginRight: 4 } }, r.author),
            React.createElement('span', { style: { color: '#71767b', fontSize: 12 } }, r.handle),
            React.createElement('p', { style: { color: '#e7e9ea', fontSize: 13, marginTop: 2 } }, r.content),
          ),
        )
      ),
    );
  }

  renderNewsCard(d) {
    return React.createElement('div', { style: { background: '#fff', borderRadius: 8, overflow: 'hidden', maxWidth: '100%' } },
      React.createElement('div', { style: { padding: '24px' } },
        React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 } },
          React.createElement('span', { style: { background: '#c0392b', color: '#fff', padding: '2px 8px', borderRadius: 4, fontSize: 11, fontWeight: 700 } }, d.category || '即時'),
          React.createElement('span', { style: { color: '#999', fontSize: 12 } }, `${d.outlet} · ${d.time || ''}`),
        ),
        React.createElement('h2', { style: { color: '#1a1a1a', fontSize: 20, fontWeight: 900, lineHeight: 1.4, marginBottom: 6 } }, d.title),
        d.subtitle ? React.createElement('p', { style: { color: '#666', fontSize: 14, marginBottom: 12 } }, d.subtitle) : null,
        React.createElement('div', { style: { color: '#333', fontSize: 15, lineHeight: 1.9, whiteSpace: 'pre-wrap' } }, d.content),
      ),
    );
  }

  renderEventCard(ev) {
    const d = ev.data;
    switch (ev.platform) {
      case 'narration': return this.renderNarrationCard(d);
      case 'stats': return this.renderStatsCard(d);
      case 'ptt': return this.renderPTTCard(d);
      case 'line': return this.renderLINECard(d);
      case 'ig': return this.renderIGCard(d);
      case 'fb': return this.renderFBCard(d);
      case 'live': return this.renderLiveCard(d);
      case 'twitter': return this.renderTwitterCard(d);
      case 'news': return this.renderNewsCard(d);
      default: return null;
    }
  }

  renderFeed() {
    const { allEvents, filterPlatform } = this.state;
    const filtered = filterPlatform === 'all' ? allEvents : allEvents.filter(e => e.platform === filterPlatform);
    if (filtered.length === 0) {
      return React.createElement('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', height: 200, color: '#555', fontSize: 14 } }, '尚無內容');
    }
    return React.createElement('div', { style: { padding: '0 16px' } },
      filtered.map((ev, i) => {
        const meta = this.platformMeta[ev.platform] || {};
        return React.createElement('div', { key: ev.id || i, style: { animation: 'slideIn 0.4s ease', animationFillMode: 'both', animationDelay: `${Math.min(i * 0.05, 0.5)}s` } },
          React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 10, padding: '18px 4px 8px' } },
            React.createElement('div', { style: { width: 2, height: 14, background: meta.color || '#333', borderRadius: 1 } }),
            React.createElement('span', { style: { background: `${meta.color || '#333'}22`, color: meta.color || '#888', padding: '3px 10px', borderRadius: 12, fontSize: 11, fontWeight: 600 } }, `${meta.icon || ''} ${meta.label || ev.platform}`),
            React.createElement('span', { style: { color: '#555', fontSize: 12, fontFamily: "'JetBrains Mono', monospace" } }, ev.time || ''),
            ev.summary ? React.createElement('span', { style: { color: '#555', fontSize: 12, fontStyle: 'italic' } }, ev.summary) : null,
          ),
          React.createElement('div', { style: { paddingLeft: 14 } }, this.renderEventCard(ev)),
        );
      })
    );
  }

  renderStatsBar() {
    const s = this.state.stats;
    const items = [
      { label: '兄妹', value: s.love_sibling, color: '#e8a0bf', icon: '💗' },
      { label: '戀愛', value: s.love_romance, color: '#ff6b8a', icon: '💘' },
      { label: '人氣', value: s.popularity, color: '#ffd700', icon: '⭐' },
      { label: '心情', value: s.mood, color: s.mood > 60 ? '#7ec77b' : s.mood > 30 ? '#e67e22' : '#e74c3c', icon: '😊' },
      { label: '安全', value: s.secret_safety, color: '#5e9cff', icon: '🔒' },
      { label: '警覺', value: s.company_alert, color: s.company_alert > 50 ? '#e74c3c' : '#888', icon: '👁' },
      { label: '輿論', value: s.public_heat, color: s.public_heat > 50 ? '#e74c3c' : '#888', icon: '🔥' },
    ];
    return React.createElement('div', { style: { display: 'flex', gap: 12, flexWrap: 'wrap' } },
      items.map((it, i) =>
        React.createElement('div', { key: i, style: { display: 'flex', alignItems: 'center', gap: 5 } },
          React.createElement('span', { style: { fontSize: 12 } }, it.icon),
          React.createElement('span', { style: { fontSize: 11, color: '#888' } }, it.label),
          React.createElement('div', { style: { width: 50, height: 4, background: '#222', borderRadius: 2, overflow: 'hidden' } },
            React.createElement('div', { style: { width: `${it.value}%`, height: '100%', background: it.color, borderRadius: 2, transition: 'width 0.5s ease' } }),
          ),
          React.createElement('span', { style: { fontSize: 11, color: it.color, fontFamily: "'JetBrains Mono', monospace", minWidth: 22 } }, it.value),
        )
      )
    );
  }

  renderVals() {
    const s = this.state;
    const isSetup = s.screen === 'setup';
    const isSimulator = s.screen === 'simulator';

    const memberOptions = Object.entries(this.members).map(([key, m]) => ({
      ...m, key,
      onClick: () => this.setState({ selectedMember: key }),
      style: s.selectedMember === key
        ? { padding: '12px 8px', background: '#1a1020', border: '2px solid #8a6abf', borderRadius: 10, cursor: 'pointer', textAlign: 'center', fontFamily: "'Noto Sans TC', sans-serif", transition: 'all 0.2s' }
        : { padding: '12px 8px', background: '#0a0a0a', border: '1px solid #2a2a2a', borderRadius: 10, cursor: 'pointer', textAlign: 'center', fontFamily: "'Noto Sans TC', sans-serif", transition: 'all 0.2s' },
    }));

    const relationOptions = this.relations.map(r => ({
      ...r,
      onClick: () => this.setState({ selectedRelation: r.key }),
      style: s.selectedRelation === r.key
        ? { padding: '12px', background: '#1a1020', border: '2px solid #8a6abf', borderRadius: 8, cursor: 'pointer', textAlign: 'left', fontFamily: "'Noto Sans TC', sans-serif", transition: 'all 0.2s' }
        : { padding: '12px', background: '#0a0a0a', border: '1px solid #2a2a2a', borderRadius: 8, cursor: 'pointer', textAlign: 'left', fontFamily: "'Noto Sans TC', sans-serif", transition: 'all 0.2s' },
    }));

    const routeOptions = this.routes.map(r => ({
      ...r,
      onClick: () => this.setState({ selectedRoute: r.key }),
      style: s.selectedRoute === r.key
        ? { padding: '14px', background: '#1a1020', border: '2px solid #8a6abf', borderRadius: 8, cursor: 'pointer', textAlign: 'left', fontFamily: "'Noto Sans TC', sans-serif", transition: 'all 0.2s', width: '100%' }
        : { padding: '14px', background: '#0a0a0a', border: '1px solid #2a2a2a', borderRadius: 8, cursor: 'pointer', textAlign: 'left', fontFamily: "'Noto Sans TC', sans-serif", transition: 'all 0.2s', width: '100%' },
    }));

    const allPlatforms = [...new Set(s.allEvents.map(e => e.platform))];
    const filterTabs = [
      { key: 'all', label: '全部' },
      ...allPlatforms.filter(p => this.platformMeta[p]).map(p => ({ key: p, label: `${this.platformMeta[p].icon} ${this.platformMeta[p].label}` })),
    ].map(t => ({
      ...t,
      onClick: () => this.setState({ filterPlatform: t.key }),
      style: s.filterPlatform === t.key
        ? { padding: '6px 14px', borderRadius: 16, border: 'none', background: '#1a1020', color: '#c8a0ff', fontSize: 12, fontWeight: 600, fontFamily: "'Noto Sans TC', sans-serif", cursor: 'pointer', whiteSpace: 'nowrap' }
        : { padding: '6px 14px', borderRadius: 16, border: 'none', background: 'transparent', color: '#666', fontSize: 12, fontWeight: 500, fontFamily: "'Noto Sans TC', sans-serif", cursor: 'pointer', whiteSpace: 'nowrap' },
    }));

    const choices = (s.storyData?.choices || []).map(c => ({
      ...c,
      onClick: () => this.continueStory(`玩家選擇了：「${c.text}」\n請根據這個選擇繼續推進劇情。`),
    }));

    return {
      showSetup: isSetup, showSimulator: isSimulator, showLoading: s.isLoading, showError: s.showError,
      errorMsg: s.errorMsg, loadingText: s.loadingText,
      apiKey: s.apiKey, model: s.model,
      charName: s.charName, charAge: s.charAge, charPersonality: s.charPersonality, charBackground: s.charBackground,
      memberOptions, relationOptions, routeOptions,
      onApiKeyChange: (e) => { this.setState({ apiKey: e.target.value }); localStorage.setItem('ds_api_key', e.target.value); },
      onModelChange: (e) => { this.setState({ model: e.target.value }); localStorage.setItem('ds_model', e.target.value); },
      onCharNameChange: (e) => this.setState({ charName: e.target.value }),
      onCharAgeChange: (e) => this.setState({ charAge: e.target.value }),
      onCharPersonalityChange: (e) => this.setState({ charPersonality: e.target.value }),
      onCharBackgroundChange: (e) => this.setState({ charBackground: e.target.value }),
      onGenerate: () => {
        if (!s.apiKey) { this.setState({ showError: true, errorMsg: '請先輸入 DeepSeek API Key' }); return; }
        if (!s.charName.trim()) { this.setState({ showError: true, errorMsg: '請輸入角色名字' }); return; }
        this.generateStory();
      },
      dismissError: () => this.setState({ showError: false }),

      storyTitle: s.storyData?.title || `${this.members[s.selectedMember]?.name}的妹妹`,
      showStats: s.showStatsPanel,
      statsBar: this.renderStatsBar(),
      toggleStats: () => this.setState({ showStatsPanel: !s.showStatsPanel }),
      filterTabs, feedRef: this.feedRef,
      feedContent: isSimulator ? this.renderFeed() : null,
      showInteraction: isSimulator, hasChoices: choices.length > 0, choices,
      userInput: s.userInput,
      onUserInputChange: (e) => this.setState({ userInput: e.target.value }),
      onUserInputKeyDown: (e) => { if (e.key === 'Enter' && s.userInput.trim()) { this.continueStory(s.userInput); this.setState({ userInput: '' }); } },
      onContinueStory: () => { if (s.userInput.trim()) { this.continueStory(s.userInput); this.setState({ userInput: '' }); } else { this.continueStory(); } },
      onReset: () => { this.clearSave(); this.setState({ screen: 'setup', storyData: null, allEvents: [], conversationHistory: [], filterPlatform: 'all', stats: { love_sibling: 15, love_romance: 0, popularity: 5, mood: 80, secret_safety: 95, company_alert: 5, public_heat: 3 } }); },
    };
  }
}

</script>
</body>
